# The product's two names, each defined here and nowhere else (D1).
#
# Everything that runs reads this file: install.sh sources it, and the CLI
# parses it. The command name also names the service user, the directories
# (/opt/<command>, /etc/<command>, /var/lib/<command>), the systemd units, the
# Docker containers, images and labels, and the test harness. Renaming either
# is a one-line change here.
#
# Environment variables keep the fixed prefix ALLVIBE_ whatever the command is
# called: they are an interface people put in their shells and scripts.
#
# Never "no" followed by "cry" as a name of its own (rule 9, D2).
PRODUCT_NAME="All vibe no cry"
COMMAND_NAME="allvibe"
