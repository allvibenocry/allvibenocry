# Test host only (D80), for restart-probe.mjs: Docker fails its first start at
# every boot, and systemd starts it again (Restart=always). /run is memory, so
# the mark is gone at the next boot. Never part of the suite.
[Service]
ExecStartPre=/bin/sh -c 'if [ ! -e /run/test-host-docker-failed-once ]; then : > /run/test-host-docker-failed-once; echo "test host: Docker fails its first start, on purpose"; exit 1; fi'
