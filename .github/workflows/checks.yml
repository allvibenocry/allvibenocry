# Checks on every push and every pull request (D6).
#
# 1. A secret scan of the whole git history with gitleaks. A secret that was
#    committed and then deleted is still in the history, so the history is what
#    is scanned, not only the latest tree.
# 2. scripts/guard.mjs: nothing named after the ransomware family (rule 9, D2),
#    and no private addresses or user profile paths (rule 10, D7).
#
# Every third-party action is pinned by commit, and gitleaks runs as its image
# pinned by digest: its GitHub Action needs a paid licence for organisations.
name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, not just the tip.
          fetch-depth: 0

      # --redact: this log is public, and a finding must not publish the
      # secret a second time. safe.directory: the checkout belongs to the
      # runner's user, and git refuses to read a repository owned by someone
      # else unless told it is safe.
      - name: gitleaks, over every commit
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=/repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --redact --verbose --exit-code 1

  guard:
    name: rules 9 and 10
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: guard
        run: node scripts/guard.mjs

  tests:
    name: unit tests and shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The runner's own Node and shellcheck: no setup action to pin.
      - name: unit tests
        run: |
          node --version
          npm ci --no-audit --no-fund
          npm test
      - name: shellcheck install.sh and firewall.sh
        run: shellcheck -x install.sh firewall.sh
