<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in to your control panel</title>
<link rel="stylesheet" href="/assets/panel.css">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<script src="/assets/entry.js" defer></script>
</head>
<body class="entry">
<main class="entry-main" id="main">
  <div class="entry-card">
    <p class="entry-logo"><svg viewBox="0 0 26 32" aria-hidden="true"><path d="M13 2C13 2 2.5 14 2.5 20.5a10.5 10.5 0 0 0 21 0C23.5 14 13 2 13 2Z" fill="#fff" stroke="#1B1530" stroke-width="2.4" stroke-linejoin="round"/><path d="M7.8 20.8l3.6 3.6 6.8-7.6" fill="none" stroke="#00A650" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>{{PRODUCT}}</p>
    <h1>Sign in</h1>
    <form id="sign-in-form" data-action="/api/sign-in" novalidate>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required aria-describedby="password-help">
        <span id="password-help" class="hint">Forgotten it? On the machine: <span class="mono">sudo {{COMMAND}} panel reset</span>, which shows a new setup code.</span>
      </div>
      <p class="form-error" id="error" role="alert" hidden></p>
      <div class="dialog-actions"><button class="btn pink" type="submit">Sign in</button></div>
    </form>
    <p class="entry-note">This panel is only on your home network, over a plain connection: someone on the same network could read what is typed here. A secure connection is planned.</p>
  </div>
</main>
</body>
</html>
